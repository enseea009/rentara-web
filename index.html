<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentara - Seamless Rentals, Smooth Journey</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="logo">RENTARA</div>
        <nav class="nav-links">
            <a href="pages/about.html">About</a>
            <a href="pages/vehicles.html">Vehicles</a>
            <a href="pages/manage-booking.html">Manage Booking</a>
        </nav>
        <div class="auth-links" id="auth-section">
            <a href="pages/login.html"><i class="fa-solid fa-user-circle"></i> Login / Sign-Up</a>
        </div>
        <div class="nav-links">
            <a href="pages/help.html"><i class="fa-solid fa-circle-question"></i> Help</a>
        </div>
    </header>

    <section class="hero">
        <h1>Seamless <span class="highlight">rentals</span>,<br>smooth <span class="highlight">journey</span>.</h1>
        <p>Your next adventure starts here — Rentara brings the perfect car to your doorstep, hassle-free and ready to
            roll.</p>

        <form class="booking-container" action="pages/search-results.html" method="GET" id="booking-form">
            <!-- Car Type -->
            <div class="form-group">
                <i class="fa-solid fa-car"></i>
                <select name="type" required>
                    <option value="" disabled selected>Car type</option>
                    <option value="Sedan">Sedan</option>
                    <option value="SUV">SUV</option>
                    <option value="Economy">Economy</option>
                    <option value="Family">Family</option>
                    <option value="Compact">Compact</option>
                </select>
            </div>

            <!-- Start Date -->
            <div class="form-group">
                <i class="fa-regular fa-calendar-days"></i>
                <input type="text" onfocus="(this.type='date')" onblur="(this.type='text')" name="start_date"
                    placeholder="Start Date" required>
            </div>

            <!-- End Date -->
            <div class="form-group">
                <i class="fa-regular fa-calendar-check"></i>
                <input type="text" onfocus="(this.type='date')" onblur="(this.type='text')" name="end_date"
                    placeholder="End Date" required>
            </div>

            <button type="submit" class="btn-primary">Book now</button>
        </form>
    </section>

    <script src="js/app.js"></script>
</body>

</html>
