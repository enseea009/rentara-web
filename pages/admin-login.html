<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentara Admin - Login</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 20px;
        }

        .admin-badge {
            background: var(--primary-color);
            color: black;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-gray);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .btn-auth {
            width: 100%;
            background: var(--primary-color);
            color: black;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn-auth:hover {
            background: var(--primary-hover);
        }

        .error-msg {
            color: var(--danger);
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <a href="../index.html" class="logo">RENTARA</a>
    </header>

    <div class="auth-container">
        <span class="admin-badge">ADMIN PORTAL</span>
        <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
        <p class="error-msg" id="error-msg"></p>

        <form id="admin-login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-auth">Access Dashboard</button>
        </form>

        <div style="margin-top: 20px;">
            <a href="login.html" style="color: var(--text-gray); font-size: 0.9rem;">Return to Customer Login</a>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Start check role
                    if (data.user.role !== 'admin') {
                        errorMsg.textContent = 'Access Denied: You do not have admin privileges.';
                        errorMsg.style.display = 'block';
                        return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Login failed';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                errorMsg.textContent = 'Server error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
