<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentara - My Profile</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: black;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-gray);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .btn-action {
            background: var(--primary-color);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-left: auto;
        }
    </style>
</head>

<body>
    <header style="position: relative; background: var(--dark-bg);">
        <a href="../index.html" class="logo">RENTARA</a>
        <nav class="nav-links">
            <a href="about.html">About</a>
            <a href="vehicles.html">Vehicles</a>
            <a href="manage-booking.html">Manage Booking</a>
        </nav>
        <div class="auth-links" id="auth-section">
            <a href="login.html"><i class="fa-solid fa-user-circle"></i> Login / Sign-Up</a>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h2 id="display-name">User Name</h2>
                    <p style="color: var(--text-gray);" id="display-email">user@example.com</p>
                </div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>

            <form>
                <h3>Personal Details</h3>
                <br>
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" id="first_name">
                </div>
                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" id="last_name">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" value="">
                </div>
                <button type="button" class="btn-action" onclick="saveProfile()">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('display-name').textContent = `${user.first_name} ${user.last_name}`;
            document.getElementById('display-email').textContent = user.email;
            document.getElementById('first_name').value = user.first_name || '';
            document.getElementById('last_name').value = user.last_name || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('phone').value = user.phone || '';
        });

        async function saveProfile() {
            const user = JSON.parse(localStorage.getItem('user'));
            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;
            const phone = document.getElementById('phone').value;

            try {
                const response = await fetch(`${API_BASE_URL}/auth/profile/${user.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ first_name, last_name, phone })
                });

                if (response.ok) {
                    // Update local storage
                    user.first_name = first_name;
                    user.last_name = last_name;
                    user.phone = phone;
                    localStorage.setItem('user', JSON.stringify(user));

                    // Update UI
                    document.getElementById('display-name').textContent = `${first_name} ${last_name}`;

                    alert('Profile updated successfully!');

                    // Trigger global header update
                    if (typeof updateHeaderAuth === 'function') updateHeaderAuth();
                } else {
                    const data = await response.json();
                    alert('Update failed: ' + data.message);
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred. Please try again.');
            }
        }
    </script>
</body>

</html>
